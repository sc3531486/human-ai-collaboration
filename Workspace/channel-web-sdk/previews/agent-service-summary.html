<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坐席服务小结 · 预览</title>
<style>
    :root{--blue:#155da4;--ink:#173b63;--muted:#6b8099;--line:#dce6f1;--paper:#fff;--soft:#f4f8fc;--success:#15805e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#edf3f8;color:var(--ink)}
    .workspace{min-height:100vh;padding:42px 7vw;background:linear-gradient(135deg,#f4f8fc,#e7eff8)}.topbar{height:54px;border-radius:10px;background:#fff;box-shadow:0 2px 12px #153b6212;display:flex;align-items:center;padding:0 22px;font-weight:700}.content{height:calc(100vh - 150px);margin-top:16px;border-radius:12px;background:#fff;opacity:.72}.mask{position:fixed;inset:0;background:#10294678;display:grid;place-items:center;padding:24px}
    .dialog{width:min(760px,100%);max-height:min(760px,calc(100vh - 48px));background:var(--paper);border-radius:14px;box-shadow:0 20px 60px #10294652;overflow:auto}.head{height:64px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.head h1{margin:0;font-size:19px;letter-spacing:.2px}.close{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:#59718b;font-size:28px;line-height:1;cursor:pointer}.close:hover{background:#eef4fa}.close:focus-visible,.choice:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #8ab6e4;outline-offset:2px}.body{padding:22px 24px 24px}.status{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border:1px solid #cfe7dc;border-radius:10px;background:#f4fbf7}.status-icon{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;background:var(--success);color:#fff;font-weight:700}.status strong{display:block;font-size:16px}.status span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 20px}.detail{padding:13px 14px;background:var(--soft);border-radius:8px}.detail small{display:block;color:var(--muted);font-size:12px}.detail b{display:block;margin-top:7px;font-size:14px;font-weight:600}.section-title{font-size:15px;margin:0 0 4px}.hint{margin:0 0 13px;color:var(--muted);font-size:13px}.business-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;margin:12px 0 20px}.business-table th{background:var(--soft);text-align:left;padding:10px 12px;color:#5b718a;font-weight:600}.business-table td{padding:11px 12px;border-top:1px solid var(--line)}.business-table td:last-child{color:var(--success);font-weight:600}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:46px;padding:0 14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;color:#385775;cursor:pointer;font:inherit}.choice[aria-pressed=true]{border-color:var(--blue);background:#eef6fd;color:#0f538f;box-shadow:inset 0 0 0 1px var(--blue)}.note{width:100%;min-height:76px;resize:vertical;margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit}.note:focus{border-color:var(--blue);outline:2px solid #c5ddf3}.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}button{font-family:inherit}.primary,.secondary{min-height:42px;padding:0 20px;border-radius:8px;cursor:pointer;font-weight:600}.primary{background:var(--blue);border:1px solid var(--blue);color:#fff}.primary:hover{background:#0f4e89}.secondary{background:#fff;border:1px solid #b9cbdb;color:#315a80}.secondary:hover{background:#f4f8fc}@media(max-width:560px){.mask{padding:12px}.head{padding:0 16px}.body{padding:18px 16px}.details{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.business-table{font-size:12px}.business-table th,.business-table td{padding:9px 7px}.footer{flex-direction:column-reverse}.footer button{width:100%}}
</style>
</head>
<body>
<main class="workspace" aria-hidden="true"><header class="topbar">视频银行 · 坐席工作台</header><section class="content"></section></main>
<section class="mask" aria-label="服务小结弹框">
  <article class="dialog" role="dialog" aria-modal="true" aria-labelledby="summary-title">
    <header class="head"><h1 id="summary-title">服务小结</h1><button class="close" type="button" aria-label="关闭服务小结">×</button></header>
    <div class="body">
      <section class="status"><span class="status-icon" aria-hidden="true">✓</span><div><strong>业务已办理完成</strong><span>请补充本次服务情况后提交小结。</span></div></section>
      <section class="details" aria-label="业务摘要"><div class="detail"><small>客户</small><b>测试用户</b></div><div class="detail"><small>业务</small><b>密码重置</b></div><div class="detail"><small>办理结果</small><b>已提交</b></div></section>
      <h2 class="section-title">本次办理业务</h2><p class="hint">同一次视频服务可登记多笔业务。</p>
      <table class="business-table"><thead><tr><th>业务流水</th><th>业务名称</th><th>办理结果</th></tr></thead><tbody><tr><td>BIZ20261014001</td><td>密码重置</td><td>已完成</td></tr><tr><td>BIZ20261014002</td><td>账户查询</td><td>已完成</td></tr></tbody></table>
      <h2 class="section-title">本次服务情况</h2><p class="hint">请选择与本次办理相符的标签，可多选。</p>
      <div class="choice-grid"><button class="choice" type="button" aria-pressed="false">资料核验完成</button><button class="choice" type="button" aria-pressed="false">客户沟通顺畅</button><button class="choice" type="button" aria-pressed="false">需后续关注</button><button class="choice" type="button" aria-pressed="false">客户主动挂断</button></div>
      <label for="note" class="section-title" style="display:block;margin-top:18px">备注 <span style="font-size:12px;font-weight:400;color:#6b8099">（选填）</span></label><textarea id="note" class="note" placeholder="填写需要留意的业务情况"></textarea>
      <footer class="footer"><button class="secondary" type="button">暂不填写</button><button class="primary" type="button">提交小结</button></footer>
    </div>
  </article>
</section>
<script>document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'))));</script>
</body>
</html>
